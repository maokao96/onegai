<title>ここに用件名を書く</title>
<script>
// ==== ここだけ書き換える。下の CSS と JS は触らない ====
const DATA = {
  // 用件名。上の <title> タグにも同じ文言を入れること
  title: "Stripe を使えるようにする",
  // これが終わると何が進むか。一行
  unblocks: "決済フォームの実装に入れます。5分ほど＋審査待ち1日",
  // 本人にしかできない作業だけ。url は実在する直リンク（無ければ省略）
  steps: [
    { id: "s1", label: "Stripe に登録する",
      body: "メールアドレスとパスワードだけで作れます",
      url: "https://dashboard.stripe.com/register", urlLabel: "登録ページ" },
    { id: "s2", label: "本人確認を出す",
      body: "免許証かパスポートの撮影。審査は1営業日ほど",
      url: "https://dashboard.stripe.com/settings/update", urlLabel: "本人確認へ" },
    { id: "s3", label: "APIキーをターミナルに貼る",
      body: "「シークレットキー」をコピーして、ターミナルに直接貼ってください。この画面には入れないこと。PCで行う作業です",
      url: "https://dashboard.stripe.com/apikeys", urlLabel: "キーの発行ページ" }
  ]
};
// ==== ここまで ====
</script>
<style>
:root{
  --bg:#F7F7F5;--card:#FFF;--ink:#1D2021;--sub:#69707A;--line:#E3E3DF;
  --acc:#2F6F4E;--acc-ink:#FFF;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181A;--card:#1F2225;--ink:#E8EAEA;--sub:#9AA3AA;--line:#2E3337;--acc:#5BA37D;--acc-ink:#10221A;
}}
:root[data-theme="dark"]{
  --bg:#16181A;--card:#1F2225;--ink:#E8EAEA;--sub:#9AA3AA;--line:#2E3337;--acc:#5BA37D;--acc-ink:#10221A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;padding:0 16px 110px;
  font:16px/1.75 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:600px;margin:0 auto}
header{padding:30px 0 6px}
h1{font-size:23px;line-height:1.45;margin:0 0 6px;text-wrap:balance}
.unblocks{color:var(--sub);font-size:14px;margin:0}
h2{font-size:14px;letter-spacing:.06em;color:var(--sub);font-weight:600;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:flex-start}
.tick{flex:0 0 28px;height:28px;margin-top:1px;border-radius:8px;border:2px solid var(--line);
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
  font-size:16px;line-height:1;color:transparent;transition:.12s}
.tick:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card.done .tick{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.card.done{opacity:.55}
.card.done .label{text-decoration:line-through}
.label{font-weight:600;font-size:16px}
.body{color:var(--sub);font-size:14px;margin-top:3px}
.go{display:inline-block;margin-top:11px;background:var(--acc);color:var(--acc-ink);
  text-decoration:none;font-weight:600;font-size:15px;padding:11px 18px;border-radius:8px}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:600px;margin:0 auto;display:flex;gap:12px;align-items:center}
#copy{flex:1;background:var(--acc);color:var(--acc-ink);border:0;border-radius:9px;
  padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#copy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#status{color:var(--sub);font-size:14px;white-space:nowrap}
#fb{display:none;margin-top:14px}
#fb p{color:var(--sub);font-size:14px;margin:0 0 6px}
#fb textarea{width:100%;min-height:100px;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
  <header><h1 id="t"></h1><p class="unblocks" id="u"></p></header>
  <h2>あなたにしかできない作業</h2>
  <div id="steps"></div>
  <div id="fb"><p>下の文字を選んでコピーし、チャットに貼ってください。</p><textarea id="fbt" readonly></textarea></div>
</main>
<div class="bar"><div class="bar-in">
  <button id="copy">終わったことをコピー</button><span id="status"></span>
</div></div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  document.title = DATA.title || document.title;
  $("#t").textContent = DATA.title || "";
  $("#u").textContent = DATA.unblocks || "";
  const done = new Set();

  (DATA.steps || []).forEach(item => {
    const el = document.createElement("div");
    el.className = "card";
    const btn = document.createElement("button");
    btn.className = "tick"; btn.textContent = "✓";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", item.label + " を終わった扱いにする");
    const col = document.createElement("div"); col.style.flex = "1";
    const lab = document.createElement("div"); lab.className = "label"; lab.textContent = item.label;
    col.appendChild(lab);
    if (item.body){ const b = document.createElement("div"); b.className = "body"; b.textContent = item.body; col.appendChild(b); }
    if (item.url){
      const a = document.createElement("a"); a.className = "go"; a.href = item.url;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = item.urlLabel || "開く"; col.appendChild(a);
    }
    const row = document.createElement("div"); row.className = "row";
    row.appendChild(btn); row.appendChild(col); el.appendChild(row);
    btn.addEventListener("click", () => {
      const on = el.classList.toggle("done");
      on ? done.add(item.id) : done.delete(item.id);
      btn.setAttribute("aria-pressed", String(on));
    });
    $("#steps").appendChild(el);
  });

  function result(){
    const steps = DATA.steps || [];
    const d = steps.filter(s => done.has(s.id)).map(s => s.id);
    const y = steps.filter(s => !done.has(s.id)).map(s => s.id);
    const lines = ["[onegai] " + (DATA.title || "")];
    lines.push("done: " + (d.length ? d.join(", ") : "(なし)"));
    if (y.length) lines.push("yet: " + y.join(", "));
    return lines.join("\n");
  }

  $("#copy").addEventListener("click", async () => {
    const text = result();
    try {
      // クリップボード API は安全なページでしか使えない（file:// では動かないことが多い）
      if (!navigator.clipboard) throw new Error("no clipboard");
      await navigator.clipboard.writeText(text);
      $("#status").textContent = "コピーしました";
    } catch (e) {
      $("#fb").style.display = "block";
      const ta = $("#fbt");
      ta.value = text; ta.focus(); ta.select();
      $("#status").textContent = "下の欄から";
      ta.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });
})();
</script>
